table:
  name: players
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
select_permissions:
  - role: public
    permission: &players_read
      columns: [id, team_id, name, is_captain, sort_order]
      filter: {}
  - role: user
    permission: *players_read
