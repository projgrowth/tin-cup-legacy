table:
  name: profiles
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: player_id
select_permissions:
  # Guests need faces on pairings / roster without signing in.
  - role: public
    permission: &profiles_public_read
      columns: [id, display_name, player_id, avatar_path]
      filter: {}
  - role: user
    permission:
      columns: [id, display_name, player_id, avatar_path, created_at, updated_at]
      filter: {}
insert_permissions:
  - role: user
    permission:
      columns: [display_name, player_id, avatar_path]
      check:
        id: {_eq: X-Hasura-User-Id}
      set:
        id: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: [display_name, player_id, avatar_path]
      filter:
        id: {_eq: X-Hasura-User-Id}
      check:
        id: {_eq: X-Hasura-User-Id}
