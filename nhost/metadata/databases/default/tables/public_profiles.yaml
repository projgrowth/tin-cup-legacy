table:
  name: profiles
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: player_id
select_permissions:
  - role: user
    permission:
      columns: [id, display_name, player_id, created_at, updated_at]
      filter: {}
insert_permissions:
  - role: user
    permission:
      columns: [display_name, player_id]
      check:
        id: {_eq: X-Hasura-User-Id}
      set:
        id: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: [display_name, player_id]
      filter:
        id: {_eq: X-Hasura-User-Id}
      check:
        id: {_eq: X-Hasura-User-Id}
