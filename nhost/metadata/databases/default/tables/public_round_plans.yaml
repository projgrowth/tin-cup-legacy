table:
  name: round_plans
  schema: public
select_permissions:
  - role: user
    permission:
      columns: [id, user_id, round_slug, plan, created_at, updated_at]
      filter:
        user_id: {_eq: X-Hasura-User-Id}
insert_permissions:
  - role: user
    permission:
      columns: [round_slug, plan]
      check:
        user_id: {_eq: X-Hasura-User-Id}
      set:
        user_id: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: [plan]
      filter:
        user_id: {_eq: X-Hasura-User-Id}
      check:
        user_id: {_eq: X-Hasura-User-Id}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id: {_eq: X-Hasura-User-Id}
