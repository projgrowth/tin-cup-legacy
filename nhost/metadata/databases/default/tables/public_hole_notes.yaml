table:
  name: hole_notes
  schema: public
select_permissions:
  - role: user
    permission: &own_notes
      columns: [id, user_id, course_id, hole, tee_club, target_line, green_note, target_score, notes, created_at, updated_at]
      filter:
        user_id: {_eq: X-Hasura-User-Id}
insert_permissions:
  - role: user
    permission:
      columns: [course_id, hole, tee_club, target_line, green_note, target_score, notes]
      check:
        user_id: {_eq: X-Hasura-User-Id}
      set:
        user_id: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: [tee_club, target_line, green_note, target_score, notes]
      filter:
        user_id: {_eq: X-Hasura-User-Id}
      check:
        user_id: {_eq: X-Hasura-User-Id}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id: {_eq: X-Hasura-User-Id}
